name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOCUCHECK_CJK_FONT: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt
      - name: Install test font and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-wqy-zenhei
          test -f "$DOCUCHECK_CJK_FONT"
          python -m pip install --no-deps -r backend/requirements-dev.lock.txt
      - name: Verify backend offline
        run: python -m scripts.verify_offline --report data/ci/backend.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-backend-verification
          path: data/ci/backend.json
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
