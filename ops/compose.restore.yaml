name: docucheck-restore

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCUCHECK_MYSQL_ROOT_PASSWORD:?Set restore-only credentials}
      MYSQL_DATABASE: docucheck
      MYSQL_USER: docucheck
      MYSQL_PASSWORD: ${DOCUCHECK_MYSQL_PASSWORD:?Set restore-only credentials}
    ports:
      - "127.0.0.1:${DOCUCHECK_RESTORE_MYSQL_PORT:-23307}:3306"
    volumes:
      - mysql_restore:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  mysql_restore:
