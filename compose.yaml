name: docucheck

x-dispatch-environment: &dispatch-environment
  DOCUCHECK_CELERY_BROKER_URL: redis://redis:6379/0
  DOCUCHECK_MYSQL_HOST: mysql
  DOCUCHECK_MYSQL_PORT: "3306"
  DOCUCHECK_MYSQL_PASSWORD: ${DOCUCHECK_MYSQL_PASSWORD:?Set DOCUCHECK_MYSQL_PASSWORD in .env}

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    profiles: [identity]
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    mem_limit: 1g
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DOCUCHECK_OIDC_ADMIN_PASSWORD:?Set DOCUCHECK_OIDC_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./data/oidc-import:/opt/keycloak/data/import:ro
      - ./deploy/keycloak/themes:/opt/keycloak/themes:ro

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCUCHECK_MYSQL_ROOT_PASSWORD:?Set DOCUCHECK_MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: docucheck
      MYSQL_USER: docucheck
      MYSQL_PASSWORD: ${DOCUCHECK_MYSQL_PASSWORD:?Set DOCUCHECK_MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DOCUCHECK_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    profiles: [agent]
    environment:
      <<: *dispatch-environment
      DOCUCHECK_MODEL_PROVIDER: ${DOCUCHECK_MODEL_PROVIDER:-}
      DOCUCHECK_MODEL_ID: ${DOCUCHECK_MODEL_ID:-}
      DOCUCHECK_MODEL_BASE_URL: ${DOCUCHECK_MODEL_BASE_URL:-}
      DOCUCHECK_MODEL_API_KEY: ${DOCUCHECK_MODEL_API_KEY:-}
      DOCUCHECK_MODEL_CONTEXT_WINDOW: ${DOCUCHECK_MODEL_CONTEXT_WINDOW:-}
      DOCUCHECK_DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 20s

  dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    profiles: [agent]
    restart: unless-stopped
    command: ["python", "-m", "app.dispatch_outbox"]
    environment: *dispatch-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  cleaner:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    profiles: [agent]
    restart: unless-stopped
    command: ["python", "-m", "app.cleanup_cases"]
    environment:
      DOCUCHECK_MYSQL_HOST: mysql
      DOCUCHECK_MYSQL_PORT: "3306"
      DOCUCHECK_MYSQL_PASSWORD: ${DOCUCHECK_MYSQL_PASSWORD:?Set DOCUCHECK_MYSQL_PASSWORD in .env}
      DOCUCHECK_DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  keycloak_data:
