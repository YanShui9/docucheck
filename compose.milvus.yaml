# Independent stack: never reuses the user's old Milvus bind mounts.
name: docucheck-vector

services:
  storage-init:
    image: docucheck-milvus:2.6.25
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /var/lib/milvus/etcd"]
    network_mode: none
    restart: "no"
    mem_limit: 64m
    volumes:
      - milvus_data:/var/lib/milvus
  # Reuse the embedded-etcd member directory with the same etcd version.
  # Waiting for endpoint health avoids Milvus's embedded startup readiness race.
  etcd:
    image: quay.io/coreos/etcd:v3.5.23@sha256:a4ff811beaa545972cd993f7d331685e8777c0dcecf5a8ae46069bf792ed4916
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    command:
      - /usr/local/bin/etcd
      - --name=default
      - --data-dir=/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://localhost:2380
      - --quota-backend-bytes=4294967296
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
    volumes:
      - type: volume
        source: milvus_data
        target: /etcd
        volume:
          subpath: etcd
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  milvus:
    build:
      context: ./deploy/milvus
      dockerfile: Dockerfile
    image: docucheck-milvus:2.6.25
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: etcd:2379
      # Otherwise Milvus re-grants three cross-database public reads on restart.
      COMMON_SECURITY_ENABLEPUBLICPRIVILEGE: "false"
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

volumes:
  milvus_data:
